  - outside_nasa_delta_rh_inside_outside
  - outside_nasa_delta_vpd_inside_outside
  - outside_fused_temperature_mean
  - outside_fused_temperature_abs_gap
  - outside_fused_relative_humidity_mean
  - outside_fused_relative_humidity_abs_gap
  - outside_fused_precipitation_mean
  - outside_fused_precipitation_max
  - outside_fused_precipitation_abs_gap
  - outside_fused_precipitation_rolling_sum_6h_mean
  - outside_fused_precipitation_rolling_sum_24h_mean
  - outside_fused_wind_speed_10m_mean
  - outside_fused_wind_speed_10m_abs_gap
  - outside_fused_shortwave_radiation_mean
