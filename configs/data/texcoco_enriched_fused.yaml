extends: configs/data/texcoco_enriched_openmeteo.yaml
weather_source_view: fused
source:
  adapter:
    mappings:
      optional:
        outside_nasa_T2M: {source: outside_nasa_T2M, dtype: float}
        outside_nasa_RH2M: {source: outside_nasa_RH2M, dtype: float}
        outside_nasa_T2MDEW: {source: outside_nasa_T2MDEW, dtype: float}
        outside_nasa_PRECTOTCORR: {source: outside_nasa_PRECTOTCORR, dtype: float}
        outside_nasa_WS10M: {source: outside_nasa_WS10M, dtype: float}
        outside_nasa_ALLSKY_SFC_SW_DWN: {source: outside_nasa_ALLSKY_SFC_SW_DWN, dtype: float}
        outside_nasa_ALLSKY_SFC_PAR_TOT: {source: outside_nasa_ALLSKY_SFC_PAR_TOT, dtype: float}
        outside_nasa_vpd_kpa: {source: outside_nasa_vpd_kpa, dtype: float}
        outside_nasa_daylight_flag: {source: outside_nasa_daylight_flag, dtype: float}
        outside_nasa_radiation_daily_sum: {source: outside_nasa_radiation_daily_sum, dtype: float}
        outside_nasa_precipitation_daily_sum: {source: outside_nasa_precipitation_daily_sum, dtype: float}
        outside_nasa_radiation_rolling_sum_6h: {source: outside_nasa_radiation_rolling_sum_6h, dtype: float}
        outside_nasa_precipitation_rolling_sum_6h: {source: outside_nasa_precipitation_rolling_sum_6h, dtype: float}
        outside_nasa_precipitation_rolling_sum_24h: {source: outside_nasa_precipitation_rolling_sum_24h, dtype: float}
        outside_nasa_delta_temp_inside_outside: {source: outside_nasa_delta_temp_inside_outside, dtype: float}
        outside_nasa_delta_rh_inside_outside: {source: outside_nasa_delta_rh_inside_outside, dtype: float}
        outside_nasa_delta_vpd_inside_outside: {source: outside_nasa_delta_vpd_inside_outside, dtype: float}
        outside_fused_temperature_mean:
          sources: [outside_openmeteo_temperature_2m, outside_nasa_T2M]
          transform: mean
          dtype: float
        outside_fused_temperature_abs_gap:
          sources: [outside_openmeteo_temperature_2m, outside_nasa_T2M]
          transform: abs_difference
          dtype: float
        outside_fused_relative_humidity_mean:
          sources: [outside_openmeteo_relative_humidity_2m, outside_nasa_RH2M]
          transform: mean
          dtype: float
        outside_fused_relative_humidity_abs_gap:
          sources: [outside_openmeteo_relative_humidity_2m, outside_nasa_RH2M]
          transform: abs_difference
          dtype: float
        outside_fused_precipitation_mean:
          sources: [outside_openmeteo_precipitation, outside_nasa_PRECTOTCORR]
          transform: mean
          dtype: float
        outside_fused_precipitation_max:
          sources: [outside_openmeteo_precipitation, outside_nasa_PRECTOTCORR]
          transform: max
          dtype: float
        outside_fused_precipitation_abs_gap:
          sources: [outside_openmeteo_precipitation, outside_nasa_PRECTOTCORR]
          transform: abs_difference
          dtype: float
        outside_fused_precipitation_rolling_sum_6h_mean:
          sources: [outside_openmeteo_precipitation_rolling_sum_6h, outside_nasa_precipitation_rolling_sum_6h]
          transform: mean
          dtype: float
        outside_fused_precipitation_rolling_sum_24h_mean:
          sources: [outside_openmeteo_precipitation_rolling_sum_24h, outside_nasa_precipitation_rolling_sum_24h]
          transform: mean
          dtype: float
        outside_fused_wind_speed_10m_mean:
          sources: [outside_openmeteo_wind_speed_10m, outside_nasa_WS10M]
          transform: mean
          dtype: float
        outside_fused_wind_speed_10m_abs_gap:
          sources: [outside_openmeteo_wind_speed_10m, outside_nasa_WS10M]
          transform: abs_difference
          dtype: float
        outside_fused_shortwave_radiation_mean:
          sources: [outside_openmeteo_shortwave_radiation, outside_nasa_ALLSKY_SFC_SW_DWN]
          transform: mean
          dtype: float
        outside_fused_shortwave_radiation_abs_gap:
          sources: [outside_openmeteo_shortwave_radiation, outside_nasa_ALLSKY_SFC_SW_DWN]
          transform: abs_difference
          dtype: float
        outside_fused_radiation_rolling_sum_6h_mean:
          sources: [outside_openmeteo_radiation_rolling_sum_6h, outside_nasa_radiation_rolling_sum_6h]
          transform: mean
          dtype: float
        outside_fused_vpd_mean:
          sources: [outside_openmeteo_vpd_kpa, outside_nasa_vpd_kpa]
          transform: mean
          dtype: float
        outside_fused_vpd_abs_gap:
          sources: [outside_openmeteo_vpd_kpa, outside_nasa_vpd_kpa]
          transform: abs_difference
          dtype: float
        outside_fused_daylight_flag_max:
          sources: [outside_openmeteo_daylight_flag, outside_nasa_daylight_flag]
          transform: max
          dtype: float
numeric_features:
  - soil_moisture
  - air_temperature
  - relative_humidity
  - radiation_proxy
  - soil_temperature
  - vpd
  - light_lux
  - ec25
  - ph
  - irrigation_event_observed
