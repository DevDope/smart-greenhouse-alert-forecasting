[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-greenhouse-alert-forecasting"
version = "0.1.0"
description = "Reproducible Texcoco greenhouse alert-forecasting benchmark."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib==1.4.2",
  "lightgbm==4.5.0",
  "matplotlib==3.9.2",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "PyYAML==6.0.2",
  "scikit-learn==1.5.2",
  "torch==2.5.1",
  "xgboost==2.1.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
]

[project.scripts]
greenhouse = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
